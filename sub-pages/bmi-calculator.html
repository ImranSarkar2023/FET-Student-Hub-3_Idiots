<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        label, input {
            display:block;
            margin: bottom 10px; 
        }
        input[type=button]{
            color: red;
        }
    </style>
</head>
<body>
    
    <label>Weight (kg)</label>
    <input type="number" id="weight">

    <label>Height (m)</label>
    <input type="number" id="height">

    <input type="button" value="Check BMI" onclick="checkBMI()">

    <p> BMI: <span id="result">--</span></p>
    <p> BMI Category: <span id="category">--</span></p>

    <script>
        function checkBMI() {
            let weight, height, bmi;
        
            weight = document.getElementById("weight").value; 
            height = document.getElementById("height").value;

            bmi = weight/(height*height);
        
            document.getElementById("result").innerText = bmi.toFixed(1);

            if(bmi < 18.5) {
                document.getElementById("category").innerText = "Underweight";
            }
            else if(bmi >= 18.5 && bmi <= 24.9) {
                document.getElementById("category").innerText = "Healthy Weight";
            }
            else if(bmi >= 25.0 && bmi <= 29.9) {
                document.getElementById("category").innerText = "Overweight";
            }
            else {
                document.getElementById("category").innerText = "Obesity";
            }

        }
    </script>
</body>
</html>
